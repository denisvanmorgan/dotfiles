# bind conf file
bind r source-file $HOME/.config/tmux/.tmux.conf

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'

# Catppuccin theme
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style "rounded"

# prefix override
unbind C-b
set-option -g prefix `
bind-key ` send-prefix

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

unbind '"'
unbind %

# don't rename windows automatically
set-option -g allow-rename off

# scroll
set -g mouse on
set -g default-terminal "tmux-256color"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

run $HOME/.config/tmux/plugins/tpm/tpm
run $HOME/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

if-shell 'tmux has-session -t =common 2>/dev/null' '' 'new-session -d -s common -c "$HOME"'
if-shell 'tmux has-session -t =ws 2>/dev/null'     '' 'new-session -d -s ws     -c "$WS_WORKSPACE"'
if-shell 'tmux has-session -t =tide 2>/dev/null'   '' 'new-session -d -s tide   -c "$TIDE_WORKSPACE"'
if-shell 'tmux has-session -t =p2p 2>/dev/null'    '' 'new-session -d -s p2p    -c "$CODE_PATH"'

set-hook -g session-closed[42] {
 run-shell 'tmux has-session -t =common 2>/dev/null || tmux new-session -d -s common -c "$HOME"'
 run-shell 'tmux has-session -t =ws 2>/dev/null     || tmux new-session -d -s ws     -c "$WS_WORKSPACE"'
 run-shell 'tmux has-session -t =tide 2>/dev/null   || tmux new-session -d -s tide   -c "$TIDE_WORKSPACE"'
 run-shell 'tmux has-session -t =p2p 2>/dev/null    || tmux new-session -d -s p2p    -c "$CODE_PATH"'
}
